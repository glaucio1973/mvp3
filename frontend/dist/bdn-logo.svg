<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 195" fill="none">
  <!-- Outer thick oval -->
  <ellipse cx="130" cy="88" rx="122" ry="80" stroke="#1B2F6E" stroke-width="11" fill="white"/>

  <!-- "Bola" - big brush style, top-left diagonal -->
  <text x="42" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="900" fill="#1B2F6E" transform="rotate(-8, 42, 72)" letter-spacing="-1">Bola</text>

  <!-- "de" - small, lower left -->
  <text x="38" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#1B2F6E" transform="rotate(-5, 38, 96)">de</text>

  <!-- "neve" - big brush style, bottom-right diagonal -->
  <text x="82" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="900" fill="#1B2F6E" transform="rotate(-8, 82, 118)" letter-spacing="-1">neve</text>

  <!-- CHURCH banner - overlaps bottom of oval -->
  <rect x="72" y="145" width="116" height="26" rx="2" fill="#1B2F6E"/>
  <text x="130" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4">CHURCH</text>

  <!-- IN JESUS WE TRUST -->
  <text x="130" y="186" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1B2F6E" text-anchor="middle" letter-spacing="3">IN JESUS WE TRUST</text>
</svg>
